# This is the resource bundle for npproj1

#Texts for manifest.json

#XTIT, 20: Application name
appTitle=LROP

#YDES: Application description
appDescription=Simple LROP application

#XTIT, 20: Main view title
title=LROP

# --- Headers and Titles ---

#XTIT, 30: Title for the List Report page
listReport=List Report

#XTIT, 30: Title for the Store List section
storeList=Store List

#XTIT, 30: Title for the Products List section
productsList=Products List

#XTIT, 30: Header for Basic Information section
basicInfo=Basic Information

#XTIT, 20: Header for Products section or Tab
products=Products

#XTIT, 30: Header for Specifications section
specs=Specs

#XTIT, 30: Header for Supplier Information section
supplierInfo=Supplier Info

#XTIT, 30: Title for the Edit Product dialog or page
editProduct=Edit Product

# --- Actions and Buttons ---

#XBUT, 15: Button text to search
search=Search

#XBUT, 25: Button text to open creation dialog
createNewStore=Create New Store

#XBUT, 10: Generic create button
create=Create

#XBUT, 10: Generic edit button
edit=Edit

#XBUT, 10: Generic delete button
delete=Delete

#XBUT, 10: Generic sort button
sort=Sort

#XBUT, 10: Generic save button
save=Save

#XBUT, 10: Generic cancel button
cancel=Cancel

# --- Field Labels and Columns ---

#XFLD, 15: Label for Date
date=Date

#XFLD, 20: Label for Name
name=Name

#XFLD, 20: Label for Floor Area
floorArea=Floor Area

#XFLD, 25: Label for Floor Area showing unit measurement
floorAreaWithUnit=Floor Area (ft)

#XFLD, 20: Label for Established Date
establishedDate=Established Date

#XFLD, 30: Label for Address
address=Address

#XFLD, 20: Label for Phone Number
phone=Phone

#XFLD, 15: Label for Price
price=Price

#XFLD, 15: Label for Rating
rating=Rating

#XTIT, 20: Table title when there are no items
tableTitleNoItems=Item

#XTIT, 25: Table title for singular with count. {0} is the number of items.
tableTitleSingular=Item ({0})

#XTIT, 25: Table title for plural with count. {0} is the number of items.
tableTitlePlural=Items ({0})

# --- Messages ---

#XMSG: Confirmation question before deleting. {0} is the name of store.
confirmDeleteStoreSingluar=Delete store "{0}"?

#XMSG: Confirmation question before deleting. {0} is the number of stores.
confirmDeleteStoresPlural=Delete the {0} selected stores?

#XMSG: Success message after deleting a single named store. {0} is the name.
deleteStoreSuccessSingular="{0}" deleted

#XMSG: Success message after deleting multiple stores. {0} is the number of items.
deleteStoreSuccessPlural={0} stores deleted

#XMSG: Error message when deletion fails
deleteErrorMessage=An error occurred while deleting the items.

#XMSG: Validation error message for required fields
fillRequiredFieldsMessage=Please fill in all required fields.

#XMSG: Success message after creating a store
storeCreatedMessage=Store created.

#XMSG: Error message when store creation fails
errorCreatingStoreMessage=An error occurred while creating the store.

#XMSG: Confirmation question before deleting a single product
cofirmDeleteProductMessage=Delete "{0}" product?

#XMSG: Success message after product deletion
productDeletedMessage=Product deleted.

#XMSG: Error message when product deletion fails
errorDeletingProductMessage=An error occurred while deleting the product.

#XMSG: Success message after product update
productUpdatedMessage=Product updated.

#XMSG: Error message when product update fails
errorUpdatingProductMessage=An error occurred while updating the product.

#XMSG: Message indicating there are no active filters
noActiveFilters=No filters active

#XMSG: Message indicating filter is applied
filtersAppliedSingular={0} filter active:

#XMSG: Message indicating filters are applied
filtersAppliedPlural={0} filters active:

#XMSG: General error message displayed when a form submission fails validation
fixErrorsInForm=Please fix the errors

#XMSG: Validation error indicating a numeric input must be greater than zero
fieldMustBePositiveNumber=Must be positive

#XMSG: Validation error indicating a mandatory field has been left empty
fieldRequiredMessage=This field is required

#XFLD: Placeholder text for the Name filter input
selectNameConditions=Select Name Conditions

#XFLD: Placeholder text for the Floor Area filter input
selectAreaConditions=Select Area conditions

#XMSG: Masked text display with click instruction
secretPlaceholder=****** (Click to show)